<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>排雪シフト（北日本重機）</title>
<style>
  :root{ --accent:#1a3d7c; --accent2:#2f6bd6; --line:#d9e1ec; --muted:#6b7a90; --ok:#1f9d55; --bad:#d64545; --bg:#f3f6fa; --day:#2e9e5b; --night:#2f6bd6; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;background:var(--bg);color:#1a2430;font-size:14px;-webkit-text-size-adjust:100%}
  h1,h2,h3{margin:0}
  .app{display:none}
  header{position:sticky;top:0;z-index:20;background:var(--accent);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  header h1{font-size:16px;font-weight:800}
  header .spacer{flex:1}
  .view-badge{background:#e8f0fe;color:#1a3d7c;border:1px solid #9db8e8;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:800;white-space:nowrap}
  header .lo{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:7px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
  nav{display:flex;gap:6px;padding:10px 14px 0;flex-wrap:wrap;max-width:1300px;margin:0 auto}
  nav button{background:#fff;border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:8px 16px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
  nav button.active{background:var(--accent);color:#fff}
  main{max-width:1300px;margin:0 auto;padding:12px 14px calc(40px + env(safe-area-inset-bottom,0px))}
  .tab{display:none} .tab.active{display:block}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap} .spacer{flex:1}
  .hint{color:var(--muted);font-size:12px;margin:6px 0 0;line-height:1.6}
  label{font-size:12px;color:var(--muted);font-weight:700}
  input,select,textarea{font-family:inherit;font-size:14px;color:#1a2430}
  input,select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent2)}
  textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%;resize:vertical;line-height:1.6}
  .btn{background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
  .btn.sec{background:#fff;color:var(--accent)} .btn.sm{padding:6px 10px;font-size:12px}
  .btn.warn{background:#fff;border-color:#e6b4b0;color:var(--bad)} .btn:disabled{opacity:.5;cursor:default}
  .empty{color:var(--muted);font-size:13px;padding:16px;text-align:center;border:1px dashed var(--line);border-radius:10px}
  .pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:800}
  .pill.day{background:#e3f5ea;color:#0f5c33;border:1px solid #a5d6bb}
  .pill.night{background:#e6edfb;color:#1a3d7c;border:1px solid #9db8e8}
  /* login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  #login .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;max-width:360px;width:100%;box-shadow:0 8px 24px rgba(0,0,0,.08)}
  #login h2{font-size:18px;color:var(--accent);margin-bottom:6px}
  #login p{color:var(--muted);font-size:13px;margin:0 0 14px}
  #login input{width:100%;margin-bottom:10px}
  #login .err{color:var(--bad);font-size:12px;min-height:16px;font-weight:700}
  /* list table (spreadsheet風) */
  .tbl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  table.sheet{border-collapse:collapse;font-size:12.5px;white-space:nowrap;min-width:100%}
  table.sheet th,table.sheet td{border:1px solid var(--line);padding:5px 8px;text-align:center;vertical-align:middle}
  table.sheet thead th{background:#eef3f9;color:var(--accent);font-weight:800;position:sticky;top:0;z-index:1}
  table.sheet tbody tr{cursor:pointer}
  table.sheet tbody tr:hover{background:#f1f6fd}
  table.sheet td.left{text-align:left}
  table.sheet td.sat{color:#1a5fb4} table.sheet td.sun{color:#c0392b}
  table.sheet .mc{line-height:1.35;min-width:78px}
  table.sheet .mc .op{font-weight:700}
  table.sheet .mc .as{font-size:11px;color:var(--muted)}
  table.sheet td.dn-day{background:#eaf6ef} table.sheet td.dn-night{background:#eaf0fb}
  .machead{font-size:11px;color:var(--muted);font-weight:700}
  /* drawer */
  #scrim{position:fixed;inset:0;background:rgba(20,28,40,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:45}
  #scrim.open{opacity:1;pointer-events:auto}
  #drawer{position:fixed;top:0;right:0;height:100vh;width:min(600px,100%);background:#fff;box-shadow:-6px 0 24px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .25s ease;z-index:50;display:flex;flex-direction:column}
  #drawer.open{transform:none}
  #drawer .dh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--accent);color:#fff;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  #drawer .dh h3{font-size:15px;font-weight:800}
  #drawer .db{padding:14px;overflow:auto;flex:1}
  #drawer .df{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:#fff;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .fldgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
  .fld{display:flex;flex-direction:column;gap:3px} .fld input,.fld select{width:100%}
  .seg{display:inline-flex;border:1px solid var(--accent);border-radius:8px;overflow:hidden}
  .seg button{background:#fff;border:none;color:var(--accent);padding:7px 16px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
  .seg button.active[data-dn="昼"]{background:var(--day);color:#fff}
  .seg button.active[data-dn="夜"]{background:var(--night);color:#fff}
  .mtbl{width:100%;border-collapse:collapse;margin-top:4px}
  .mtbl th,.mtbl td{border:1px solid var(--line);padding:4px 6px;text-align:left}
  .mtbl th{background:#f4f7fb;font-size:11px;color:var(--muted);font-weight:800}
  .mtbl td.mk{width:70px;font-weight:800;color:var(--accent);background:#f8fafd;text-align:center}
  .mtbl td input{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px}
  .dumpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-top:6px}
  .dumpcell{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fbfdff}
  .dumpcell label{display:block;font-size:11px;color:var(--muted);font-weight:800;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dumpcell input{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 6px;text-align:center;font-weight:800}
  .dumptotal{border-color:var(--accent);background:#eef3f9} .dumptotal input{background:transparent;border:none;color:var(--accent)}
  .memgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .memgrid .fld textarea{min-height:64px;font-size:13px}
  body.readonly .edit-only{display:none !important}
  body.readonly #drawer input,body.readonly #drawer select,body.readonly #drawer textarea{background:#f5f7fa;pointer-events:none}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222c3a;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
  #toast.show{opacity:.96}
  .offline-badge{position:fixed;right:10px;bottom:10px;background:#8a5a00;color:#fff;font-size:11px;font-weight:800;border-radius:8px;padding:5px 9px;z-index:40;display:none}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h2>排雪シフト（北日本重機）</h2>
    <p id="login-note">パスワードを入力してください。</p>
    <input id="login-pw" type="password" placeholder="パスワード" autocomplete="current-password">
    <button class="btn" style="width:100%" onclick="tryLogin()">ログイン</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<div class="app" id="app">
  <header>
    <h1>排雪シフト（北日本重機）</h1>
    <span class="view-badge" id="view-badge" style="display:none">閲覧モード</span>
    <div class="spacer"></div>
    <button class="lo" onclick="logout()">ログアウト</button>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<!-- 右スライド入力パネル -->
<div id="scrim" onclick="closeDrawer()"></div>
<div id="drawer">
  <div class="dh">
    <h3 id="drawer-title">予定入力</h3>
    <div class="spacer"></div>
    <button class="lo" onclick="closeDrawer()">閉じる</button>
  </div>
  <div class="db" id="drawer-body"></div>
  <div class="df edit-only">
    <button class="btn warn sm" id="drawer-del" onclick="deleteEntry()" style="display:none">削除</button>
    <div class="spacer"></div>
    <button class="btn" id="drawer-save" onclick="saveEntry()">💾 保存</button>
  </div>
</div>

<div id="toast"></div>
<div class="offline-badge" id="offline-badge">⚠ オフライン（保存は共有されません）</div>

<datalist id="dl-op"></datalist>
<datalist id="dl-assist"></datalist>
<datalist id="dl-worker"></datalist>
<datalist id="dl-sewa"></datalist>
<datalist id="dl-keibi"></datalist>
<datalist id="dl-driver"></datalist>

<script>
/*═══════════ 設定（既存の除雪ボードと同じGAS・パスワードを共有） ═══════════*/
const GAS_URL   = 'https://script.google.com/macros/s/AKfycbx7DtBGTk_QGYsHK7mGNxigC2FhTM-ZZds8O33pziuErRTv2tH-ab6MvjfjOBeK7_Z_Pg/exec';
const API_TOKEN = 'kenun-josetsu-2026';
const APP_PASSWORD = 'kITAMARUCHI';
const VIEW_PASSWORD = 'Kitamaruchi';
const DEMO = GAS_URL.indexOf('PASTE') >= 0;
const AUTH_KEY = 'haisetsu_auth_mode';
let READONLY = false, offline = false;

/*═══════════ 既定値・状態 ═══════════*/
const DEFAULT_MACHINES  = ['BR','G','TS1','TS2','TS3','TS4','BH','SR1','SR2'];
const DEFAULT_BANS      = ['A班','B班'];
const DEFAULT_COMPANIES = ['小橋','春興業','丸山','タイヨウ','佐藤','末広','ケンウン'];
const WD_JP = ['日','月','火','水','木','金','土'];
const MEMBER_ROLES = [
  {key:'op',label:'オペ',dl:'dl-op'},{key:'assist',label:'助手',dl:'dl-assist'},
  {key:'worker',label:'作業員',dl:'dl-worker'},{key:'sewa',label:'世話役',dl:'dl-sewa'},
  {key:'keibi',label:'警備',dl:'dl-keibi'},{key:'driver',label:'運転手',dl:'dl-driver'}
];

let MACHINES  = DEFAULT_MACHINES.slice();
let BANS      = DEFAULT_BANS.slice();
let COMPANIES = DEFAULT_COMPANIES.slice();
let MEMBERS   = {op:[],assist:[],worker:[],sewa:[],keibi:[],driver:[]};
let TEMPLATES = {};   // { '<班名>': { '<機械>': {op,assist} } }
let ENTRIES   = [];   // [{row,id,ban,date,dn,start,work,place,site,machines:{slot:{op,assist}},dumps:{},driver,motomura,keibi,workers,sewa}]
let CFG_ROW=null, TPL_ROW=null;
let CUR_TAB = null;          // 現在のタブ（班名 or 'all' or 'settings'）
let DRAFT=null, DRAFT_ROW=null, DRAFT_ISNEW=false;

/*═══════════ ユーティリティ ═══════════*/
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
// インラインhandlerの ' ... ' 引数に安全に埋め込む（JSエスケープ＋属性用HTMLエスケープ）。班/機械/会社名に ' や \ が入っても壊れないように。
function jsarg(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(window.__tt); window.__tt=setTimeout(function(){ t.classList.remove('show'); },2600); }
function todayISO(){ const d=new Date(); d.setHours(0,0,0,0); return isoOf(d); }
function isoOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseISO(s){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m?new Date(Number(m[1]),Number(m[2])-1,Number(m[3])):new Date(); }
function wdOf(s){ return WD_JP[parseISO(s).getDay()]; }
function wdCls(s){ const d=parseISO(s).getDay(); return d===0?'sun':(d===6?'sat':''); }
function mmdd(s){ const d=parseISO(s); return (d.getMonth()+1)+'/'+d.getDate(); }
function uid(){ return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function linesToArr(t){ return String(t||'').split(/\r?\n/).map(function(x){ return x.trim(); }).filter(Boolean); }

/*═══════════ 通信 ═══════════*/
let mockSubs=[];
async function callApi(payload){
  if(DEMO) return mockApi(payload);
  const body = JSON.stringify(Object.assign({token:API_TOKEN}, payload));
  for(let attempt=0; attempt<2; attempt++){
    try{
      const ctrl=new AbortController(); const timer=setTimeout(function(){ ctrl.abort(); },10000);
      const res=await fetch(GAS_URL,{method:'POST',body:body,signal:ctrl.signal}); clearTimeout(timer);
      const json=await res.json(); offline=false; updateOffline(); return json;
    }catch(e){ if(attempt===1){ offline=true; updateOffline(); return mockApi(payload); } }
  }
}
function mockApi(payload){
  const a=payload.action;
  if(a==='list') return {ok:true, submissions: mockSubs.map(function(x){ return Object.assign({},x); })};
  if(a==='saveSub'){
    const sub=Object.assign({},payload.sub||{}); let row=sub.row;
    if(!row||row<2){ const f=mockSubs.find(function(x){ return (x.year||'')===(sub.year||'')&&x.company===sub.company&&x.doc===sub.doc; }); row=f?f.row:(mockSubs.reduce(function(mx,x){ return Math.max(mx,x.row||1); },1)+1); }
    sub.row=row; const i=mockSubs.findIndex(function(x){ return x.row===row; }); if(i>=0) mockSubs[i]=sub; else mockSubs.push(sub); return {ok:true,row:row};
  }
  if(a==='delSub'){ mockSubs=mockSubs.filter(function(x){ return x.row!==payload.row; }); return {ok:true}; }
  return {ok:false,error:'mock:'+a};
}
function updateOffline(){ const b=document.getElementById('offline-badge'); if(b) b.style.display=offline?'block':'none'; }

/*═══════════ 読込（__HS__マーカー） ═══════════*/
async function loadAll(){
  const res=await callApi({action:'list'});
  const subs=(res&&Array.isArray(res.submissions))?res.submissions:[];
  MACHINES=DEFAULT_MACHINES.slice(); BANS=DEFAULT_BANS.slice(); COMPANIES=DEFAULT_COMPANIES.slice();
  MEMBERS={op:[],assist:[],worker:[],sewa:[],keibi:[],driver:[]}; TEMPLATES={}; ENTRIES=[]; CFG_ROW=null; TPL_ROW=null;
  subs.forEach(function(s){
    if((s.year||'')!=='__HS__') return;
    let o={}; try{ o=JSON.parse(s.note||'{}'); }catch(e){ o={}; }
    if(s.company==='CFG'){ CFG_ROW=s.row;
      if(o.members) MEMBERS=Object.assign({op:[],assist:[],worker:[],sewa:[],keibi:[],driver:[]},o.members);
      if(Array.isArray(o.companies)&&o.companies.length) COMPANIES=o.companies;
      if(Array.isArray(o.machines)&&o.machines.length) MACHINES=o.machines;
      if(Array.isArray(o.bans)&&o.bans.length) BANS=o.bans;
    } else if(s.company==='TPL'){ TPL_ROW=s.row; if(o.templates&&typeof o.templates==='object') TEMPLATES=o.templates; }
    else if(s.company==='ENT'&&s.doc){ o.row=s.row; if(!o.id) o.id=s.doc; if(!o.machines) o.machines={}; if(!o.dumps) o.dumps={}; ENTRIES.push(o); }
  });
  if(!CUR_TAB) CUR_TAB = BANS[0] || 'all';
  renderAll();
}
function renderAll(){ renderDatalists(); renderNav(); renderTab(); }

/*═══════════ ログイン ═══════════*/
function saveAuthMode(){ try{ localStorage.setItem(AUTH_KEY,READONLY?'view':'edit'); }catch(e){} }
function clearAuthMode(){ try{ localStorage.removeItem(AUTH_KEY); }catch(e){} }
function applyReadonly(){ document.body.classList.toggle('readonly',READONLY); const b=document.getElementById('view-badge'); if(b) b.style.display=READONLY?'':'none'; }
function enter(mode){ READONLY=(mode==='view'); applyReadonly(); saveAuthMode();
  document.getElementById('login').style.display='none'; document.getElementById('app').style.display='block'; loadAll(); }
function tryLogin(){ const pw=document.getElementById('login-pw').value;
  if(pw===APP_PASSWORD||pw===VIEW_PASSWORD) enter(pw===VIEW_PASSWORD?'view':'edit');
  else document.getElementById('login-err').textContent='パスワードが違います'; }
function logout(){ READONLY=false; clearAuthMode(); document.body.classList.remove('readonly');
  document.getElementById('app').style.display='none'; document.getElementById('login').style.display='flex';
  document.getElementById('login-pw').value=''; document.getElementById('login-err').textContent=''; }
function restoreSession(){ let m=null; try{ m=localStorage.getItem(AUTH_KEY); }catch(e){} if(m!=='edit'&&m!=='view') return false; enter(m); return true; }

/*═══════════ 名簿 datalist ═══════════*/
function renderDatalists(){ MEMBER_ROLES.forEach(function(r){ const dl=document.getElementById(r.dl); if(dl) dl.innerHTML=(MEMBERS[r.key]||[]).map(function(n){ return '<option value="'+esc(n)+'">'; }).join(''); }); }

/*═══════════ ナビ（班タブ＋全体＋設定） ═══════════*/
function renderNav(){
  const nav=document.getElementById('nav');
  let html = BANS.map(function(b){ return '<button data-tab="'+esc(b)+'" onclick="switchTab(\''+jsarg(b)+'\')">'+esc(b)+'</button>'; }).join('');
  html += '<button data-tab="all" onclick="switchTab(\'all\')">📋 全体</button>';
  html += '<button data-tab="settings" class="edit-only" onclick="switchTab(\'settings\')">⚙ 班テンプレ・設定</button>';
  nav.innerHTML = html;
  if(BANS.indexOf(CUR_TAB)<0 && CUR_TAB!=='all' && CUR_TAB!=='settings') CUR_TAB = BANS[0]||'all';
  Array.prototype.forEach.call(nav.querySelectorAll('button'), function(btn){ btn.classList.toggle('active', btn.getAttribute('data-tab')===CUR_TAB); });
}
function switchTab(name){ CUR_TAB=name; renderNav(); renderTab(); }

/*═══════════ タブ本体 ═══════════*/
function renderTab(){
  const main=document.getElementById('main');
  if(CUR_TAB==='settings'){ main.innerHTML=settingsHtml(); wireSettings(); return; }
  const isAll = (CUR_TAB==='all');
  const ban = isAll ? null : CUR_TAB;
  let list = ENTRIES.filter(function(e){ return isAll || e.ban===ban; });
  list.sort(function(a,b){ return (a.date||'').localeCompare(b.date||'') || (a.dn==='夜'?1:0)-(b.dn==='夜'?1:0) || (a.ban||'').localeCompare(b.ban||''); });
  main.innerHTML =
    '<div class="card"><div class="row">'
    + '<h2 style="color:var(--accent);margin:0">'+(isAll?'全体（すべての班）':esc(ban))+'</h2>'
    + '<span class="hint" style="margin:0 0 0 6px">'+list.length+'件</span>'
    + '<div class="spacer"></div>'
    + '<button class="btn edit-only" onclick="openNew(\''+(isAll?'':jsarg(ban))+'\')">＋ 予定入力</button>'
    + '</div>'
    + '<p class="hint">行をクリックすると右側の入力パネルが開いて編集できます。'+(isAll?'（班・日付・昼夜で並んでいます）':'')+'</p>'
    + '<div class="tbl-scroll" style="margin-top:10px">'+sheetHtml(list,isAll)+'</div>'
    + '</div>';
  wireSheet();
}
function machHeadCols(){ return MACHINES.map(function(m){ return '<th class="machead">'+esc(m)+'</th>'; }).join(''); }
function sheetHtml(list,isAll){
  if(!list.length) return '<div class="empty">まだ予定がありません。'+(READONLY?'':'右上の「＋ 予定入力」から追加してください。')+'</div>';
  const head='<tr>'
    + (isAll?'<th>班</th>':'')
    + '<th>日付</th><th>曜</th><th>昼夜</th><th>開始</th><th>作業内容</th><th>箇所</th><th>堆積場</th>'
    + machHeadCols()
    + '<th>ダンプ計</th><th>警備</th><th>作業員</th><th>世話役</th></tr>';
  const body=list.map(function(e){
    const dnCls = e.dn==='夜'?'dn-night':(e.dn==='昼'?'dn-day':'');
    let mcells = MACHINES.map(function(m){
      const mm=(e.machines&&e.machines[m])?e.machines[m]:{};
      const op=mm.op||'', as=mm.assist||'';
      if(!op&&!as) return '<td></td>';
      return '<td class="mc"><div class="op">'+esc(op)+'</div>'+(as?'<div class="as">'+esc(as)+'</div>':'')+'</td>';
    }).join('');
    return '<tr data-id="'+esc(e.id)+'">'
      + (isAll?'<td>'+esc(e.ban||'')+'</td>':'')
      + '<td>'+esc(mmdd(e.date))+'</td>'
      + '<td class="'+wdCls(e.date)+'">'+esc(wdOf(e.date))+'</td>'
      + '<td class="'+dnCls+'">'+esc(e.dn||'')+'</td>'
      + '<td>'+esc(e.start||'')+'</td>'
      + '<td class="left">'+esc(e.work||'')+'</td>'
      + '<td class="left">'+esc(e.place||'')+'</td>'
      + '<td class="left">'+esc(e.site||'')+'</td>'
      + mcells
      + '<td>'+dumpTotal(e)+'</td>'
      + '<td>'+esc(e.keibi||'')+'</td>'
      + '<td class="left">'+esc(e.workers||'')+'</td>'
      + '<td class="left">'+esc(e.sewa||'')+'</td>'
      + '</tr>';
  }).join('');
  return '<table class="sheet"><thead>'+head+'</thead><tbody>'+body+'</tbody></table>';
}
function wireSheet(){
  Array.prototype.forEach.call(document.querySelectorAll('#main table.sheet tbody tr'), function(tr){
    tr.onclick=function(){ const e=ENTRIES.find(function(x){ return x.id===tr.getAttribute('data-id'); }); if(e) openEdit(e); };
  });
}
function dumpTotal(e){ let t=0; COMPANIES.forEach(function(c){ const v=Number(e.dumps&&e.dumps[c]); if(!isNaN(v)) t+=v; }); return t; }

/*═══════════ ドロワー（右パネル入力） ═══════════*/
function blankEntry(ban){ const o={id:uid(),ban:ban||BANS[0]||'A班',date:todayISO(),dn:'昼',start:'',work:'',place:'',site:'',machines:{},dumps:{},driver:'',motomura:'',keibi:'',workers:'',sewa:''};
  MACHINES.forEach(function(m){ o.machines[m]={op:'',assist:''}; }); return o; }
function openNew(ban){ if(READONLY){ toast('閲覧モードのため編集できません'); return; }
  DRAFT=blankEntry(ban||(CUR_TAB!=='all'&&CUR_TAB!=='settings'?CUR_TAB:'')); DRAFT_ROW=null; DRAFT_ISNEW=true;
  applyTemplate(); // 班テンプレを初期反映
  openDrawer('予定入力（新規）'); document.getElementById('drawer-del').style.display='none';
}
function openEdit(e){ DRAFT=JSON.parse(JSON.stringify(e)); if(!DRAFT.machines) DRAFT.machines={}; MACHINES.forEach(function(m){ if(!DRAFT.machines[m]) DRAFT.machines[m]={op:'',assist:''}; });
  DRAFT_ROW=e.row!=null?e.row:null; DRAFT_ISNEW=false;
  openDrawer('予定を編集'); document.getElementById('drawer-del').style.display = READONLY?'none':'';
}
function openDrawer(title){ document.getElementById('drawer-title').textContent=title; renderDrawer();
  document.getElementById('scrim').classList.add('open'); document.getElementById('drawer').classList.add('open'); }
function closeDrawer(){ document.getElementById('scrim').classList.remove('open'); document.getElementById('drawer').classList.remove('open'); DRAFT=null; }
function applyTemplate(){
  const t=TEMPLATES[DRAFT.ban]||{};
  MACHINES.forEach(function(m){ const src=t[m]||{}; DRAFT.machines[m]={op:src.op||'',assist:src.assist||''}; });
}
function onBanChange(v){ DRAFT.ban=v;
  // 新規で機械がまだ空なら、その班のテンプレを反映
  const empty = MACHINES.every(function(m){ const mm=DRAFT.machines[m]||{}; return !mm.op && !mm.assist; });
  if(DRAFT_ISNEW || empty){ applyTemplate(); }
  renderDrawer();
}
function renderDrawer(){
  const dnBtn=function(v){ return '<button type="button" data-dn="'+v+'" class="'+(DRAFT.dn===v?'active':'')+'" onclick="dfDN(\''+v+'\')">'+v+'</button>'; };
  let mrows=MACHINES.map(function(m){ const mm=DRAFT.machines[m]||{op:'',assist:''};
    return '<tr><td class="mk">'+esc(m)+'</td>'
      + '<td><input list="dl-op" value="'+esc(mm.op||'')+'" placeholder="オペ" oninput="dfMach(\''+jsarg(m)+'\',\'op\',this.value)"></td>'
      + '<td><input list="dl-assist" value="'+esc(mm.assist||'')+'" placeholder="助手" oninput="dfMach(\''+jsarg(m)+'\',\'assist\',this.value)"></td></tr>';
  }).join('');
  let dumpCells=COMPANIES.map(function(c){ const v=(DRAFT.dumps&&DRAFT.dumps[c]!=null)?DRAFT.dumps[c]:'';
    return '<div class="dumpcell"><label title="'+esc(c)+'">'+esc(c)+'</label><input type="number" min="0" inputmode="numeric" value="'+esc(v)+'" oninput="dfDump(\''+jsarg(c)+'\',this.value)"></div>';
  }).join('');
  const banOpts=BANS.map(function(b){ return '<option'+(DRAFT.ban===b?' selected':'')+'>'+esc(b)+'</option>'; }).join('');
  document.getElementById('drawer-body').innerHTML =
    '<div class="fldgrid">'
    +  fld('班','<select onchange="onBanChange(this.value)">'+banOpts+'</select>')
    +  fld('日付','<input type="date" value="'+esc(DRAFT.date||'')+'" onchange="dfSet(\'date\',this.value)">')
    +  fld('昼夜','<div class="seg">'+dnBtn('昼')+dnBtn('夜')+'</div>')
    +  fld('開始時間','<input value="'+esc(DRAFT.start||'')+'" placeholder="例）5:00" oninput="dfSet(\'start\',this.value)">')
    + '</div>'
    + '<div class="fldgrid">'
    +  fld('作業内容','<input value="'+esc(DRAFT.work||'')+'" placeholder="幹線拡幅 など" oninput="dfSet(\'work\',this.value)">')
    +  fld('作業箇所・町内会','<input value="'+esc(DRAFT.place||'')+'" oninput="dfSet(\'place\',this.value)">')
    +  fld('雪堆積場','<input value="'+esc(DRAFT.site||'')+'" oninput="dfSet(\'site\',this.value)">')
    + '</div>'
    + '<div class="row" style="margin-bottom:4px"><label>機械・オペ・助手</label><div class="spacer"></div>'
    +  '<button type="button" class="btn sec sm edit-only" onclick="applyTemplate();renderDrawer();toast(\'この班のテンプレを反映しました\')">この班のテンプレを反映</button></div>'
    + '<table class="mtbl"><thead><tr><th class="mk">機械</th><th>オペ</th><th>助手</th></tr></thead><tbody>'+mrows+'</tbody></table>'
    + '<label style="display:block;margin-top:14px">各社ダンプ台数</label>'
    + '<div class="dumpgrid">'+dumpCells+'<div class="dumpcell dumptotal"><label>合計</label><input type="number" id="df-total" value="'+dumpTotal(DRAFT)+'" readonly></div></div>'
    + '<div class="fldgrid" style="margin-top:14px">'
    +  fld('ケンウン運転手','<input list="dl-driver" value="'+esc(DRAFT.driver||'')+'" oninput="dfSet(\'driver\',this.value)">')
    +  fld('モトムラ','<input value="'+esc(DRAFT.motomura||'')+'" oninput="dfSet(\'motomura\',this.value)">')
    +  fld('タウン警備（人数）','<input type="number" min="0" inputmode="numeric" value="'+esc(DRAFT.keibi||'')+'" oninput="dfSet(\'keibi\',this.value)">')
    + '</div>'
    + '<div class="fldgrid">'
    +  fld('作業員（カンマ区切り可）','<input list="dl-worker" value="'+esc(DRAFT.workers||'')+'" oninput="dfSet(\'workers\',this.value)">')
    +  fld('世話役（カンマ区切り可）','<input list="dl-sewa" value="'+esc(DRAFT.sewa||'')+'" oninput="dfSet(\'sewa\',this.value)">')
    + '</div>';
}
function fld(label,inner){ return '<div class="fld"><label>'+esc(label)+'</label>'+inner+'</div>'; }
function dfSet(k,v){ DRAFT[k]=v; }
function dfDN(v){ DRAFT.dn=v; Array.prototype.forEach.call(document.querySelectorAll('#drawer .seg button'), function(b){ b.classList.toggle('active', b.getAttribute('data-dn')===v); }); }
function dfMach(m,k,v){ if(!DRAFT.machines[m]) DRAFT.machines[m]={op:'',assist:''}; DRAFT.machines[m][k]=v; }
function dfDump(c,v){ if(!DRAFT.dumps) DRAFT.dumps={}; DRAFT.dumps[c]=(v===''?'':Number(v)); const t=document.getElementById('df-total'); if(t) t.value=dumpTotal(DRAFT); }
async function saveEntry(){
  if(READONLY){ toast('閲覧モードのため編集できません'); return; }
  if(!DRAFT.date){ toast('日付を入れてください'); return; }
  const btn=document.getElementById('drawer-save'); btn.disabled=true; btn.textContent='保存中...';
  const sub={year:'__HS__',company:'ENT',doc:DRAFT.id,status:'',date:'',link:'',note:JSON.stringify(DRAFT)};
  if(DRAFT_ROW!=null) sub.row=DRAFT_ROW;
  const res=await callApi({action:'saveSub',sub:sub});
  btn.disabled=false; btn.textContent='💾 保存';
  if(res&&res.ok){
    const keepRow=(!offline&&res.row!=null)?res.row:(DRAFT_ROW!=null?DRAFT_ROW:null);
    const saved=JSON.parse(JSON.stringify(DRAFT)); saved.row=keepRow;
    const i=ENTRIES.findIndex(function(x){ return x.id===saved.id; });
    if(i>=0) ENTRIES[i]=saved; else ENTRIES.push(saved);
    closeDrawer(); renderTab();
    toast(offline?'保存しました（オフライン：共有されていません）':'保存しました');
  }else toast('保存に失敗：'+(res&&res.error?res.error:'不明'));
}
async function deleteEntry(){
  if(READONLY){ toast('閲覧モードのため編集できません'); return; }
  if(!confirm('この予定を削除しますか？')) return;
  const existing=ENTRIES.find(function(x){ return x.id===DRAFT.id; });
  if(!existing || existing.row==null){ ENTRIES=ENTRIES.filter(function(x){ return x.id!==DRAFT.id; }); closeDrawer(); renderTab(); toast('削除しました'); return; }
  const res=await callApi({action:'delSub',row:existing.row});
  if(res&&res.ok){ ENTRIES=ENTRIES.filter(function(x){ return x.id!==DRAFT.id; }); closeDrawer(); renderTab(); toast('削除しました'); }
  else toast('削除に失敗：'+(res&&res.error?res.error:'不明'));
}

/*═══════════ 班テンプレ・設定タブ ═══════════*/
function settingsHtml(){
  // 班テンプレ（班ごとに 機械×オペ・助手）
  let tpl = BANS.map(function(b){
    let rows=MACHINES.map(function(m){ const mm=(TEMPLATES[b]&&TEMPLATES[b][m])?TEMPLATES[b][m]:{};
      return '<tr><td class="mk">'+esc(m)+'</td>'
        + '<td><input list="dl-op" value="'+esc(mm.op||'')+'" placeholder="オペ" oninput="tplSet(\''+jsarg(b)+'\',\''+jsarg(m)+'\',\'op\',this.value)"></td>'
        + '<td><input list="dl-assist" value="'+esc(mm.assist||'')+'" placeholder="助手" oninput="tplSet(\''+jsarg(b)+'\',\''+jsarg(m)+'\',\'assist\',this.value)"></td></tr>';
    }).join('');
    return '<div class="card"><h3 style="color:var(--accent);margin-bottom:8px">'+esc(b)+' の顔ぶれ</h3>'
      + '<table class="mtbl"><thead><tr><th class="mk">機械</th><th>オペ</th><th>助手</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }).join('');
  let mem=MEMBER_ROLES.map(function(r){ return '<div class="fld"><label>'+esc(r.label)+'（1行1名）</label><textarea id="set-mem-'+r.key+'">'+esc((MEMBERS[r.key]||[]).join('\n'))+'</textarea></div>'; }).join('');
  return '<div class="card"><div class="row"><h2 style="color:var(--accent);margin:0">班テンプレート</h2><div class="spacer"></div>'
      + '<button class="btn sm edit-only" onclick="saveTemplates()">💾 テンプレを保存</button></div>'
      + '<p class="hint">班ごとに、機械（BR・G・TS1…）のオペ・助手の顔ぶれを登録します。入力パネルで班を選ぶと、この顔ぶれが自動で入ります。</p>'
      + '<div style="margin-top:10px">'+tpl+'</div></div>'
    + '<div class="card"><div class="row"><h2 style="color:var(--accent);margin:0">班・機械・会社の設定</h2><div class="spacer"></div>'
      + '<button class="btn sm edit-only" onclick="saveConfig()">💾 設定を保存</button></div>'
      + '<p class="hint">班（タブになります）・機械の並び・ダンプ集計の会社を、それぞれ1行1つで入れてください。変更・保存すると各画面に反映されます。</p>'
      + '<div class="fldgrid" style="margin-top:10px">'
      +   '<div class="fld"><label>班（タブ）</label><textarea id="set-bans" style="min-height:110px">'+esc(BANS.join('\n'))+'</textarea></div>'
      +   '<div class="fld"><label>機械の並び</label><textarea id="set-mach" style="min-height:110px">'+esc(MACHINES.join('\n'))+'</textarea></div>'
      +   '<div class="fld"><label>ダンプの会社</label><textarea id="set-cmp" style="min-height:110px">'+esc(COMPANIES.join('\n'))+'</textarea></div>'
      + '</div></div>'
    + '<div class="card"><div class="row"><h2 style="color:var(--accent);margin:0">名簿（入力候補）</h2><div class="spacer"></div>'
      + '<button class="btn sm edit-only" onclick="saveMembersFromSettings()">💾 名簿を保存</button></div>'
      + '<p class="hint">よく使う名前を役割ごとに入れておくと、入力時に候補として出ます。</p>'
      + '<div class="memgrid" style="margin-top:10px">'+mem+'</div></div>';
}
function wireSettings(){ /* 入力はインラインで反映済み */ }
function tplSet(ban,m,k,v){ if(!TEMPLATES[ban]) TEMPLATES[ban]={}; if(!TEMPLATES[ban][m]) TEMPLATES[ban][m]={op:'',assist:''}; TEMPLATES[ban][m][k]=v; }
async function saveTemplates(){
  if(READONLY){ toast('閲覧モードのため編集できません'); return; }
  const sub={year:'__HS__',company:'TPL',doc:'templates',status:'',date:'',link:'',note:JSON.stringify({templates:TEMPLATES})};
  if(TPL_ROW!=null) sub.row=TPL_ROW;
  const res=await callApi({action:'saveSub',sub:sub});
  if(res&&res.ok){ if(!offline&&res.row!=null) TPL_ROW=res.row; toast(offline?'保存しました（オフライン）':'班テンプレを保存しました'); }
  else toast('保存に失敗：'+(res&&res.error?res.error:'不明'));
}
async function saveConfig(){
  if(READONLY){ toast('閲覧モードのため編集できません'); return; }
  const bans=linesToArr(document.getElementById('set-bans').value);
  const mach=linesToArr(document.getElementById('set-mach').value);
  const cmp =linesToArr(document.getElementById('set-cmp').value);
  if(bans.length) BANS=bans; if(mach.length) MACHINES=mach; if(cmp.length) COMPANIES=cmp;
  const ok=await saveCfg(); if(ok){ if(BANS.indexOf(CUR_TAB)<0&&CUR_TAB!=='all'&&CUR_TAB!=='settings') CUR_TAB='settings'; renderAll(); toast(offline?'保存しました（オフライン）':'設定を保存しました'); }
}
function saveMembersFromSettings(){
  if(READONLY){ toast('閲覧モードのため編集できません'); return; }
  MEMBER_ROLES.forEach(function(r){ const t=document.getElementById('set-mem-'+r.key); if(t) MEMBERS[r.key]=linesToArr(t.value); });
  renderDatalists();
  saveCfg().then(function(ok){ if(ok) toast(offline?'保存しました（オフライン）':'名簿を保存しました'); });
}
async function saveCfg(){
  const sub={year:'__HS__',company:'CFG',doc:'config',status:'',date:'',link:'',note:JSON.stringify({members:MEMBERS,companies:COMPANIES,machines:MACHINES,bans:BANS})};
  if(CFG_ROW!=null) sub.row=CFG_ROW;
  const res=await callApi({action:'saveSub',sub:sub});
  if(res&&res.ok){ if(!offline&&res.row!=null) CFG_ROW=res.row; return true; }
  toast('保存に失敗：'+(res&&res.error?res.error:'不明')); return false;
}
